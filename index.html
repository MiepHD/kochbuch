<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Infinite Canvas mit Pan & Zoom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Seitenleiste -->
    <aside class="sidebar">
      <h3>Elemente</h3>
      <div class="draggable-item" draggable="true" data-type="card">Karte</div>
      <div class="draggable-item" draggable="true" data-type="button">Button</div>
    </aside>

    <!-- Viewport (Sichtbarer Bereich) -->
    <div id="viewport" class="canvas-viewport">
      <!-- Unendliche Canvas-Fläche -->
      <div id="canvas" class="canvas-content">
        <!-- SVG-Layer für Pfeile/Verbindungen -->
        <svg id="svg-layer" class="svg-layer">
          <defs>
            <marker id="arrowhead" 
        viewBox="0 0 10 10" 
        refX="8" refY="5" 
        markerWidth="6" markerHeight="6" 
        orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
</marker>
          </defs>
        </svg>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
